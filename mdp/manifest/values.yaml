# specific override for MDP on top of manifests/charts/istio-cni/value.yaml
global:
  # placeholder for mdp hub/tag in the template
  hub: "{{ .MDP_HUB }}"
  tag: "{{ .MDP_TAG }}"
  sds:
    token:
      aud: "PROJECT_ID.svc.id.goog"
  logging:
    level: default:"{{ .LOG_LEVEL }}",cni:"{{ .LOG_LEVEL }}"
cni:
  cniBinDir: /home/kubernetes/bin
  logLevel: "{{ .LOG_LEVEL }}"
mdp:
  enabled: true