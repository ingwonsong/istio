apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
metadata:
  name: istio-operator
spec:
  components:
    pilot:
      k8s:
        env:
        - name: GKE_CLUSTER_URL
          value: "https://staging-container.sandbox.googleapis.com/v1/projects/PROJECT_ID/locations/us-central1-c/clusters/asm-cluster" # kpt-set: https://staging-container.sandbox.googleapis.com/v1/projects/${gcloud.core.project}/locations/${gcloud.compute.location}/clusters/${gcloud.container.cluster}
        - name: GCP_METADATA
          value: "PROJECT_ID|PROJECT_NUMBER|asm-cluster|us-central1-c" # kpt-set: ${gcloud.core.project}|${gcloud.project.projectNumber}|${gcloud.container.cluster}|${gcloud.compute.location}
        - name: SPIFFE_BUNDLE_ENDPOINTS
          value: "PROJECT_ID.svc.id.goog|https://storage.googleapis.com/mesh-ca-resources/spiffe_bundle.json" # kpt-set: ${gcloud.core.project}.svc.id.goog|https://storage.googleapis.com/mesh-ca-resources/spiffe_bundle.json
        - name: ENABLE_STACKDRIVER_MONITORING
          value: "true" # {"$ref":"#/definitions/io.k8s.cli.setters.anthos.servicemesh.controlplane.monitoring.enabled"}
        - name: TOKEN_AUDIENCES
          value: "PROJECT_ID.svc.id.goog" # kpt-set: istio-ca,${gcloud.core.project}.svc.id.goog
        - name: PILOT_ENABLE_WORKLOAD_ENTRY_AUTOREGISTRATION
          value: "true"
  meshConfig:
    defaultConfig:
      proxyMetadata:
        GKE_CLUSTER_URL: "https://staging-container.sandbox.googleapis.com/v1/projects/PROJECT_ID/locations/us-central1-c/clusters/asm-cluster" # kpt-set: https://staging-container.sandbox.googleapis.com/v1/projects/${gcloud.core.project}/locations/${gcloud.compute.location}/clusters/${gcloud.container.cluster}
