apiVersion: sut.tailorbird.io/v1alpha1
kind: Rookery
metadata:
  # !!!IMPORTANT!!!! READ BELOW
  # Use names that are unique and easily identifiable
  # To see list of currently running rookeries:
  # kubectl get rookeries -n tailorbird-users
  # To view existing knests:
  # kubectl get knests -n tailorbird-users
  # To view existing clusters:
  # kubectl get clusters.sut.tailorbird.io -n tailorbird-users
  # e.g., use your Google username as prefix.
  # !!!IMPORTANT!!!! READ ABOVE
  name: asm-ci-onprem-mcmn
  namespace: tailorbird-users
spec:
  ttlSeconds: 10800 # 3 hours
  knests:
  - apiVersion: sut.tailorbird.io/v1alpha1
    kind: Knest
    metadata:
      name: asm-ci-onprem-mcmn-knest
    spec:
      clusters:
      - apiVersion: sut.tailorbird.io/v1alpha1
        kind: Cluster
        metadata:
          name: asm-ci-onprem-mcmn-cluster-01
        spec:
          provider: vsphere
          distribution: gke
          provisionerArgs:
            lbkind: "MetalLB"
            username: prowuser
            workerNumNodes: "4"
            {{- if .Version }}
            gkectlVersion: "{{ .Version }}"
            {{- end }}
            {{- if .VersionPrefix }}
            gkectlVersionPrefix: "{{ .VersionPrefix }}"
            releaseMode: "true"
            useStagingBucket: "true"
            {{- end }}
            # workaround for b/181781346
            gkectlConfigSeedVersion: "v1"
            gkeConnectProject: "{{ .OnPremHubDevProject }}"
            stackdriverProjectId: "{{ .OnPremHubDevProject }}"
            # gkeConnectSA: "{{ .OnPremGkeConnectSA }}"
            vsphereVersion: "7.0"
            esxiVersion: "7.0"
            controlPlaneV2Enabled: "true"
            additionalNodes: "4"
            ipAllocationStrategy: static
      - apiVersion: sut.tailorbird.io/v1alpha1
        kind: Cluster
        metadata:
          name: asm-ci-onprem-mcmn-cluster-02
        spec:
          provider: vsphere
          distribution: gke
          provisionerArgs:
            lbkind: "MetalLB"
            username: prowuser
            workerNumNodes: "4"
            {{- if .Version }}
            gkectlVersion: "{{ .Version }}"
            {{- end }}
            {{- if .VersionPrefix }}
            gkectlVersionPrefix: "{{ .VersionPrefix }}"
            releaseMode: "true"
            useStagingBucket: "true"
            {{- end }}
            # workaround for b/181781346
            gkectlConfigSeedVersion: "v1"
            gkeConnectProject: "{{ .OnPremHubDevProject }}"
            stackdriverProjectId: "{{ .OnPremHubDevProject }}"
            # gkeConnectSA: "{{ .OnPremGkeConnectSA }}"
            vsphereVersion: "7.0"
            esxiVersion: "7.0"
            controlPlaneV2Enabled: "true"
            userAcnMode: "true"
            additionalNodes: "4"
            ipAllocationStrategy: static