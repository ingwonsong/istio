apiVersion: sut.tailorbird.io/v1alpha1
kind: Rookery
metadata:
  name: asm-gcp-eks-hybrid-rookery
  namespace: tailorbird-users
spec:
  ttlSeconds: 10800 # 3 hours
  knests:
  - apiVersion: sut.tailorbird.io/v1alpha1
    kind: Knest
    metadata:
      creationTimestamp: null
      name: asm-gcp-eks-hybrid-knest
    spec:
      clusters:
      - apiVersion: sut.tailorbird.io/v1alpha1
        kind: Cluster
        metadata:
          creationTimestamp: null
          name: asm-gcp-eks-hybrid-gcp-cluster
        spec:
          distribution: gke
          provider: gcp
          provisionerArgs:
            pluginSpecYaml: |
              pluginOptions:
                # note: this currently leaves orphan firewall rules, needs some sort of janitor
                skipNetworkTeardowns: true
              projectOptions:
                projects: {{ .OnPremHubDevProject }}
              networkOptions:
                network: default
              clusterOptions:
                clusters: asm-gcp-eks-hybrid-gcp-cluster-{{ randNumeric 3 }}
                regions: us-west1
                gcloudExtraFlags: --enable-ip-alias --subnetwork=default
                workloadIdentityEnabled: true
      - apiVersion: sut.tailorbird.io/v1alpha1
        kind: Cluster
        metadata:
          name: asm-gcp-eks-hybrid-eks-cluster
        spec:
          provider: aws
          distribution: eks
          provisionerArgs:
            auth: "SAToken"
            kubernetesVersion: "1.24"
            username: asm-svc-acct
            compressArtifacts: "true"
            nodeCount: "4"
            nodeType: "t3.medium"
